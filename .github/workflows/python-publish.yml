name: Publish Python Package

on:
  release:
    types: [published]
  # TEMPORARY: manual trigger to exercise notify-failure. Remove together with
  # the forced failure in release-build.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      # TEMPORARY: fail before anything is built or uploaded, so notify-failure
      # opens its issue. This blocks every publish, a real release included.
      # Remove together with the workflow_dispatch trigger above.
      - name: Force a failure to exercise notify-failure
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    steps:
      # TEMPORARY: second stop, in case the one in release-build is removed or
      # bypassed. Nothing must reach PyPI while this branch is on main. Remove
      # together with the workflow_dispatch trigger above.
      - name: Force a failure to exercise notify-failure
        run: exit 1

      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  notify-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs:
      - release-build
      - pypi-publish
    permissions:
      issues: write

    steps:
      - name: Open and pin an issue for the failed publish
        env:
          ASSIGNEES: "ishymko,mykytanetipa"
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n\n%s\n' \
            "$TAG is not on PyPI. The publish workflow failed." \
            "Failed run: $RUN_URL" > body.md

          url="$(gh issue create --repo "$REPO" \
            --title "Publish failed for $TAG" \
            --label 'component: tooling' \
            --body-file body.md)"
          echo "Opened $url"

          # Assigning and pinning must never discard the alert itself.
          gh issue edit "$url" --add-assignee "$ASSIGNEES" \
            || echo "::warning::Could not assign $url"
          gh issue pin "$url" \
            || echo "::warning::Could not pin $url. A repository allows at most 3 pinned issues."

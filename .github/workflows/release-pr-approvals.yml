name: release-pr-approvals

# Fails until N approvals are present on a release-please PR, so the job's check
# run ("release-pr-approvals / approvals") can be a required status check on the
# protected branch. Normal PRs pass immediately.
#
# A PR counts as a release PR if ANY signal matches: head branch prefix, author,
# or an autorelease label. Matching on any one is deliberate — missing a real
# release PR reopens the accidental-merge gap, while over-matching only asks for
# a second approval.
#
# Uses pull_request_target (not pull_request) so the check always runs and
# reports on PRs from forks without waiting for first-time-contributor run
# approval; this job never checks out or executes PR code, so the usual
# pull_request_target risk does not apply.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-pr-approvals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approvals:
    runs-on: ubuntu-latest
    env:
      REQUIRED_APPROVALS: "2"
      RELEASE_BRANCH_PREFIX: "release-please--"
      RELEASE_AUTHOR: "a2a-bot"
      RELEASE_LABEL_PREFIX: "autorelease:"
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const required = Number(process.env.REQUIRED_APPROVALS);
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const labels = (pr.labels ?? []).map((l) => l.name);
            const isRelease =
              pr.head.ref.startsWith(process.env.RELEASE_BRANCH_PREFIX) ||
              pr.user?.login === process.env.RELEASE_AUTHOR ||
              labels.some((n) => n.startsWith(process.env.RELEASE_LABEL_PREFIX));

            if (!isRelease) {
              core.info('Not a release PR');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            // Latest decisive review per user; COMMENTED does not change approval state.
            const latest = new Map();
            for (const r of reviews) {
              if (!r.user || r.state === 'COMMENTED') continue;
              latest.set(r.user.id, r.state);
            }
            const approvals = [...latest.values()].filter((s) => s === 'APPROVED').length;

            const summary = `${approvals}/${required} approvals`;
            if (approvals < required) {
              core.setFailed(`Release PR blocked: ${summary}`);
            } else {
              core.info(`Release PR OK: ${summary}`);
            }

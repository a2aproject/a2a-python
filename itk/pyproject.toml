[project]
name = "itk-python-v10-agent"
version = "0.1.0"
description = "ITK Python v1.0 Agent"
dependencies = [
    "a2a-sdk[sqlite,grpc,http-server]",
    "fastapi",
    "uvicorn",
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "sse-starlette",
    "httpx-sse",
    "packaging",
]

[tool.uv]
package = false

[tool.uv.sources]
# Resolved from the workspace root (../pyproject.toml declares this dir a
# member), so the whole repo shares one uv.lock instead of this agent
# keeping a second lock that drifts when a root dependency changes.
a2a-sdk = { workspace = true }
